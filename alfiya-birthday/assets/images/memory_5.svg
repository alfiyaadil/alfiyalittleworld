<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep Galaxy Gradient -->
    <linearGradient id="galaxyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a26" />
      <stop offset="40%" stop-color="#1f1847" />
      <stop offset="75%" stop-color="#3d2159" />
      <stop offset="100%" stop-color="#642b58" />
    </linearGradient>

    <!-- Nebula Glow -->
    <radialGradient id="nebulaPink" cx="65%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ff7eb3" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#e056fd" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#e056fd" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaCyan" cx="30%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#68d8d6" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#07b1ca" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#07b1ca" stop-opacity="0" />
    </radialGradient>

    <!-- Moon Glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="1" />
      <stop offset="60%" stop-color="#ffe699" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f39c12" stop-opacity="0" />
    </radialGradient>

    <filter id="starBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="crescentBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="600" height="600" fill="url(#galaxyGrad)" />
  <rect width="600" height="600" fill="url(#nebulaPink)" />
  <rect width="600" height="600" fill="url(#nebulaCyan)" />

  <!-- Stars Background Field -->
  <g fill="#ffffff">
    <circle cx="50" cy="80" r="1.5" opacity="0.8" />
    <circle cx="110" cy="190" r="2" opacity="0.9" />
    <circle cx="170" cy="60" r="1" opacity="0.6" />
    <circle cx="230" cy="140" r="2.5" opacity="0.85" />
    <circle cx="310" cy="90" r="1.5" opacity="0.7" />
    <circle cx="390" cy="120" r="2" opacity="0.9" />
    <circle cx="480" cy="70" r="1" opacity="0.6" />
    <circle cx="530" cy="150" r="2" opacity="0.8" />
    <circle cx="90" cy="280" r="1.5" opacity="0.7" />
    <circle cx="150" cy="350" r="1.2" opacity="0.5" />
    <circle cx="270" cy="290" r="2" opacity="0.8" />
    <circle cx="350" cy="340" r="1.5" opacity="0.7" />
    <circle cx="440" cy="270" r="2.2" opacity="0.9" />
    <circle cx="520" cy="320" r="1" opacity="0.6" />
    <circle cx="70" cy="460" r="1.5" opacity="0.7" />
    <circle cx="130" cy="520" r="2" opacity="0.8" />
    <circle cx="240" cy="470" r="1.2" opacity="0.5" />
    <circle cx="320" cy="510" r="1.8" opacity="0.8" />
    <circle cx="420" cy="480" r="1" opacity="0.6" />
    <circle cx="510" cy="450" r="2.5" opacity="0.9" />
    <circle cx="560" cy="530" r="1.5" opacity="0.7" />
  </g>

  <!-- Luminous Crescent Moon with Flower Vine -->
  <g transform="translate(420, 90)" filter="url(#crescentBloom)">
    <!-- Halo -->
    <circle cx="50" cy="50" r="65" fill="#ffeaa7" opacity="0.25" />
    <!-- Moon Shape -->
    <path d="M70,10 C100,30 110,80 80,110 C50,140 0,130 -10,100 C30,110 70,80 70,10 Z" fill="#fff9e6" />
    <!-- Soft Gold Edge -->
    <path d="M70,10 C100,30 110,80 80,110" fill="none" stroke="#ffd166" stroke-width="3" opacity="0.8" />
  </g>

  <!-- Shooting Star Streaking Across -->
  <g opacity="0.85">
    <line x1="80" y1="120" x2="280" y2="40" stroke="url(#moonGlow)" stroke-width="3" stroke-linecap="round" filter="url(#starBloom)" />
    <circle cx="280" cy="40" r="4" fill="#ffffff" filter="url(#starBloom)" />
  </g>

  <!-- Constellation: Heart & 19 -->
  <g stroke="rgba(255, 230, 245, 0.65)" stroke-width="1.8" stroke-dasharray="4,4">
    <!-- Heart Constellation -->
    <line x1="220" y1="230" x2="260" y2="190" />
    <line x1="260" y1="190" x2="300" y2="210" />
    <line x1="300" y1="210" x2="340" y2="190" />
    <line x1="340" y1="190" x2="380" y2="230" />
    <line x1="380" y1="230" x2="300" y2="310" />
    <line x1="300" y1="310" x2="220" y2="230" />
  </g>

  <!-- Constellation Glowing Star Nodes -->
  <g fill="#ffffff" filter="url(#starBloom)">
    <circle cx="220" cy="230" r="4.5" fill="#ffb4d6" />
    <circle cx="260" cy="190" r="5" fill="#ffffff" />
    <circle cx="300" cy="210" r="4" fill="#ffb4d6" />
    <circle cx="340" cy="190" r="5" fill="#ffffff" />
    <circle cx="380" cy="230" r="4.5" fill="#ffb4d6" />
    <circle cx="300" cy="310" r="6" fill="#ffd166" />
  </g>

  <!-- Starlight Flares (4-point sparkle stars) -->
  <g fill="#ffffff" filter="url(#starBloom)">
    <!-- Star 1 -->
    <path d="M300,300 Q300,310 290,310 Q300,310 300,320 Q300,310 310,310 Q300,310 300,300 Z" fill="#ffeaa7" transform="scale(1.8) translate(-133, -137)" />
    <!-- Star 2 -->
    <path d="M140,180 Q140,190 130,190 Q140,190 140,200 Q140,190 150,190 Q140,190 140,180 Z" fill="#ffffff" />
    <!-- Star 3 -->
    <path d="M480,240 Q480,250 470,250 Q480,250 480,260 Q480,250 490,250 Q480,250 480,240 Z" fill="#ff9ff3" />
  </g>

  <!-- Gentle Hill Silhouette at Bottom with Wild Flower Grasses -->
  <path d="M0,530 Q160,490 320,520 Q460,545 600,500 L600,600 L0,600 Z" fill="#0c0717" />
  <path d="M0,560 Q200,530 400,560 Q500,575 600,540 L600,600 L0,600 Z" fill="#07030e" />

  <!-- Glowing Mason Jar of Fireflies / Starlight on the Hill -->
  <g transform="translate(265, 430)">
    <!-- Glow -->
    <circle cx="35" cy="55" r="50" fill="#ffeaa7" opacity="0.35" filter="url(#starBloom)" />
    <!-- Jar Outline -->
    <rect x="10" y="20" width="50" height="65" rx="12" fill="rgba(255,255,255,0.18)" stroke="rgba(255,255,255,0.6)" stroke-width="2.5" />
    <rect x="18" y="12" width="34" height="10" rx="3" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.7)" stroke-width="2" />
    <!-- Little Firefly Glows -->
    <circle cx="28" cy="40" r="3.5" fill="#fff59d" filter="url(#starBloom)" />
    <circle cx="45" cy="50" r="4" fill="#ffffff" filter="url(#starBloom)" />
    <circle cx="32" cy="65" r="3.5" fill="#ffd54f" filter="url(#starBloom)" />
    <!-- Floating fireflies escaping -->
    <circle cx="25" cy="-5" r="3" fill="#ffe082" filter="url(#starBloom)" />
    <circle cx="55" cy="-25" r="3.5" fill="#fff59d" filter="url(#starBloom)" />
  </g>
</svg>
