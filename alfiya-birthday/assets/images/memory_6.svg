<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Pink Glow -->
    <radialGradient id="bdayBg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fff0f5" />
      <stop offset="45%" stop-color="#ffe4ed" />
      <stop offset="85%" stop-color="#fed6e3" />
      <stop offset="100%" stop-color="#f8bfd2" />
    </radialGradient>

    <!-- Rose Gold Foil Gradient -->
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7c8d3" />
      <stop offset="35%" stop-color="#df91a3" />
      <stop offset="70%" stop-color="#f9d5df" />
      <stop offset="100%" stop-color="#c46d82" />
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7" />
      <stop offset="50%" stop-color="#fdcb6e" />
      <stop offset="100%" stop-color="#e17055" />
    </linearGradient>

    <filter id="glow19" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShad" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(180, 80, 120, 0.25)" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bdayBg)" />

  <!-- Floating Confetti & Sparkles -->
  <g opacity="0.75">
    <!-- Confetti ribbons & discs -->
    <circle cx="80" cy="90" r="7" fill="#f48fb1" />
    <circle cx="160" cy="50" r="5" fill="#ffd54f" />
    <circle cx="230" cy="110" r="6" fill="#81ecec" />
    <circle cx="370" cy="70" r="8" fill="#fab1a0" />
    <circle cx="480" cy="100" r="6" fill="#fd79a8" />
    <circle cx="530" cy="60" r="5" fill="#ffeaa7" />
    <circle cx="70" cy="220" r="5" fill="#ffeaa7" />
    <circle cx="510" cy="250" r="7" fill="#81ecec" />

    <rect x="110" y="140" width="6" height="18" rx="3" fill="#ff7675" transform="rotate(35 110 140)" />
    <rect x="440" y="150" width="6" height="18" rx="3" fill="#fd79a8" transform="rotate(-40 440 150)" />
    <rect x="290" y="45" width="5" height="16" rx="2" fill="#ffeaa7" transform="rotate(20 290 45)" />
    <rect x="60" y="410" width="6" height="18" rx="3" fill="#74b9ff" transform="rotate(55 60 410)" />
    <rect x="520" y="390" width="6" height="18" rx="3" fill="#fdcb6e" transform="rotate(-25 520 390)" />
  </g>

  <!-- Pastel Birthday Balloons in Background -->
  <!-- Balloon 1 (Pink) -->
  <g transform="translate(100, 70)" opacity="0.88">
    <ellipse cx="60" cy="80" rx="55" ry="65" fill="#ffb4c8" filter="url(#softShad)" />
    <ellipse cx="42" cy="50" rx="14" ry="24" fill="#ffffff" opacity="0.45" transform="rotate(-20 42 50)" />
    <polygon points="56,145 64,145 60,152" fill="#e89bb0" />
    <path d="M60,152 Q50,210 75,280" fill="none" stroke="#d48a9e" stroke-width="1.8" />
  </g>

  <!-- Balloon 2 (Rose Gold / Champagne) -->
  <g transform="translate(380, 50)" opacity="0.88">
    <ellipse cx="60" cy="80" rx="52" ry="62" fill="#ffd199" filter="url(#softShad)" />
    <ellipse cx="42" cy="50" rx="13" ry="22" fill="#ffffff" opacity="0.45" transform="rotate(-20 42 50)" />
    <polygon points="56,142 64,142 60,149" fill="#e2a86b" />
    <path d="M60,149 Q80,210 50,290" fill="none" stroke="#d49a60" stroke-width="1.8" />
  </g>

  <!-- Balloon 3 (Soft Lilac Center-Back) -->
  <g transform="translate(240, 20)" opacity="0.75">
    <ellipse cx="60" cy="80" rx="46" ry="56" fill="#e8c5fc" />
    <ellipse cx="45" cy="55" rx="10" ry="18" fill="#ffffff" opacity="0.4" transform="rotate(-15 45 55)" />
    <path d="M60,136 Q40,190 60,260" fill="none" stroke="#ba9bd0" stroke-width="1.5" />
  </g>

  <!-- Center Birthday Card / Milestone Plaque -->
  <g transform="translate(150, 180)">
    <!-- Plaque Glow -->
    <rect x="-10" y="-10" width="320" height="260" rx="32" fill="#ffffff" opacity="0.6" filter="url(#glow19)" />
    <!-- Plaque Main Body -->
    <rect x="0" y="0" width="300" height="240" rx="26" fill="#ffffff" stroke="#f6cad8" stroke-width="2" filter="url(#softShad)" />
    <!-- Decorative Inner Border -->
    <rect x="12" y="12" width="276" height="216" rx="18" fill="none" stroke="#fce4ec" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- Top Badge -->
    <rect x="85" y="-14" width="130" height="28" rx="14" fill="url(#roseGold)" filter="url(#softShad)" />
    <text x="150" y="5" font-family="'Quicksand', sans-serif" font-weight="700" font-size="11" fill="#ffffff" letter-spacing="2" text-anchor="middle">CHAPTER 19</text>

    <!-- Large Giant "19" in Elegant Rose Gold -->
    <text x="150" y="115" font-family="'Playfair Display', serif" font-weight="700" font-style="italic" font-size="78" fill="url(#roseGold)" text-anchor="middle" filter="url(#glow19)">19</text>

    <!-- Subtitle in Cursive -->
    <text x="150" y="152" font-family="'Sacramento', cursive" font-size="28" fill="#d85a8a" text-anchor="middle">Happy Birthday, Alfiya</text>

    <!-- Sweet Tagline -->
    <text x="150" y="182" font-family="'Quicksand', sans-serif" font-weight="600" font-size="12" fill="#8c5b6f" letter-spacing="1" text-anchor="middle">RADIANT • CHERISHED • LOVED</text>

    <!-- Little Hearts Underneath -->
    <text x="150" y="210" font-size="16" fill="#e05688" text-anchor="middle">🌸 ✨ 💖 ✨ 🌸</text>
  </g>

  <!-- Beautiful Flower Bed & Birthday Gift Bottom Decor -->
  <g transform="translate(0, 440)">
    <!-- Table Runner / Base -->
    <path d="M0,70 L600,70 L600,160 L0,160 Z" fill="#fff5f8" />

    <!-- Elegant Rose Blooms along the base -->
    <!-- Flower 1 -->
    <circle cx="80" cy="70" r="28" fill="#f8a5c2" />
    <circle cx="80" cy="70" r="18" fill="#f78fb3" />
    <circle cx="80" cy="70" r="9" fill="#e66767" />
    <!-- Flower Leaves -->
    <ellipse cx="48" cy="78" rx="14" ry="7" fill="#81c784" transform="rotate(-30 48 78)" />

    <!-- Flower 2 (Center-Left) -->
    <circle cx="190" cy="65" r="34" fill="#ffccd5" />
    <circle cx="190" cy="65" r="22" fill="#ffb3c1" />
    <circle cx="190" cy="65" r="11" fill="#fb6f92" />
    <ellipse cx="230" cy="75" rx="16" ry="8" fill="#a8e6cf" transform="rotate(25 230 75)" />

    <!-- Birthday Gift Box in Bottom Right -->
    <g transform="translate(380, -20)">
      <rect x="0" y="25" width="110" height="90" rx="10" fill="#ffc2d1" filter="url(#softShad)" />
      <!-- Ribbon vertical -->
      <rect x="45" y="25" width="20" height="90" fill="url(#goldRibbon)" />
      <!-- Ribbon horizontal -->
      <rect x="0" y="55" width="110" height="20" fill="url(#goldRibbon)" />
      <!-- Box Lid -->
      <rect x="-6" y="15" width="122" height="22" rx="6" fill="#ffb3c6" filter="url(#softShad)" />
      <rect x="45" y="15" width="20" height="22" fill="url(#goldRibbon)" />
      <!-- Bow -->
      <ellipse cx="40" cy="8" rx="18" ry="12" fill="url(#goldRibbon)" transform="rotate(-25 40 8)" />
      <ellipse cx="70" cy="8" rx="18" ry="12" fill="url(#goldRibbon)" transform="rotate(25 70 8)" />
      <circle cx="55" cy="15" r="8" fill="#fdcb6e" />
    </g>

    <!-- Flower 3 (Right) -->
    <circle cx="520" cy="70" r="30" fill="#f8a5c2" />
    <circle cx="520" cy="70" r="19" fill="#f78fb3" />
    <circle cx="520" cy="70" r="9" fill="#e66767" />
    <ellipse cx="555" cy="80" rx="14" ry="7" fill="#81c784" transform="rotate(20 555 80)" />
  </g>

  <!-- Sparkler Glints on Card Corners -->
  <g fill="#ffd166" filter="url(#glow19)">
    <circle cx="150" cy="180" r="5" />
    <circle cx="450" cy="180" r="5" />
    <circle cx="150" cy="420" r="4" />
    <circle cx="450" cy="420" r="4" />
  </g>
</svg>
